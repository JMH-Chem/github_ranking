name: deploy-site

# Builds the Astro site from data/ and publishes it to GitHub Pages.
# The weekly workflow calls this after committing new data (pushes made with
# GITHUB_TOKEN don't trigger workflows on their own).
on:
  push:
    paths:
      - "site/**"
      - "data/**"
      - "pipeline/categories.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Check that Pages deploys from GitHub Actions
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build_type=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .build_type 2>/dev/null || true)
          if [ "$build_type" = "workflow" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GitHub Pages가 GitHub Actions 배포로 설정돼 있지 않아 배포를 건너뜁니다. Settings → Pages → Build and deployment → Source를 'GitHub Actions'로 바꾸세요."
          fi
      - if: steps.check.outputs.enabled == 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
      - if: steps.check.outputs.enabled == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - if: steps.check.outputs.enabled == 'true'
        id: pages
        uses: actions/configure-pages@v5
      - if: steps.check.outputs.enabled == 'true'
        run: npm ci && npm run build
        working-directory: site
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - if: steps.check.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/dist

  deploy:
    needs: build
    if: needs.build.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
