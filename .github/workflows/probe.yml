name: probe-trending-html
on:
  push:
    paths: [".github/workflows/probe.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Dump trending HTML structure
        run: |
          curl -sSL -A "Mozilla/5.0 (github_ranking probe)" "https://github.com/trending?since=weekly" -o weekly.html
          echo "size: $(wc -c < weekly.html)"
          echo "article count: $(grep -o '<article' weekly.html | wc -l)"
          echo "Box-row count: $(grep -o 'Box-row' weekly.html | wc -l)"
          echo "===== FIRST TWO ARTICLES ====="
          python3 - <<'PY'
          import re
          html = open("weekly.html", encoding="utf-8").read()
          arts = re.findall(r"<article.*?</article>", html, re.S)
          print("regex articles:", len(arts))
          for a in arts[:2]:
              print(re.sub(r"\n\s*\n+", "\n", a))
              print("-----")
          i = html.find("Trending")
          print("===== DATE RANGE / HEADER SNIPPET =====")
          m = re.search(r"(date-range|since).{0,400}", html, re.S)
          print(m.group(0)[:400] if m else "none")
          PY
          curl -sSL -A "Mozilla/5.0 (github_ranking probe)" "https://github.com/trending/python?since=weekly" -o py.html
          echo "python tab articles: $(grep -o '<article' py.html | wc -l)"
